name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Verify
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Applications
        shell: cmd
        run: |
          call build.bat

      - name: Verify Output Binaries
        shell: pwsh
        run: |
          $binaries = @(
            "bin\OmniHidTaskbar.exe",
            "bin\OmniHidTaskbarDebug.exe",
            "bin\OmniHid.Core.dll"
          )
          foreach ($bin in $binaries) {
            if (-not (Test-Path $bin)) {
              throw "Required binary not found: $bin"
            }
            Write-Host "Verified: $bin"
          }